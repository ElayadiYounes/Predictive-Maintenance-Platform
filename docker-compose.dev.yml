name: ${PROJECT_NAME}

networks:
  ocp-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  metabase_data:
  airflow_logs:
  platform_logs:

services:

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile

    image: ${PROJECT_NAME}/api:${APP_ENV}

    restart: unless-stopped

    depends_on:

      minio:
        condition: service_healthy

      hive-server:
        condition: service_started

    networks:
      - ocp-network

    ports:
      - "${API_PORT}:8000"

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME: api

      # Hive
      HIVE_SERVER_HOST: hive-server
      HIVE_SERVER_PORT: 10000

      # MinIO
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Buckets
      GOLD_BUCKET: ${GOLD_BUCKET}
      MODELS_BUCKET: ${MODELS_BUCKET}

      # Mail
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ml:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile

    image: ${PROJECT_NAME}/ml:${APP_ENV}

    restart: "no"

    depends_on:

      minio:
        condition: service_healthy

      spark-master:
        condition: service_healthy

    networks:
      - ocp-network

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME: ml

      # Spark
      SPARK_MASTER_URL: spark://spark-master:${SPARK_MASTER_PORT}

      HIVE_METASTORE_URI: thrift://hive-metastore:9083

      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}

      # MinIO
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Buckets
      SILVER_BUCKET: ${SILVER_BUCKET}
      GOLD_BUCKET: ${GOLD_BUCKET}
      MODELS_BUCKET: ${MODELS_BUCKET}

    volumes:
      - ./jobs/ml:/app/jobs

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    command: tail -f /dev/null



  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: ${PROJECT_NAME}/airflow:${APP_ENV}

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ocp-network

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME: airflow

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DATABASE}

      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

    entrypoint: >
      /bin/sh -c "airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname ${AIRFLOW_ADMIN_FIRSTNAME} --lastname ${AIRFLOW_ADMIN_LASTNAME} --role Admin --email ${AIRFLOW_ADMIN_EMAIL} &&
      echo 'Airflow init done'"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: ${PROJECT_NAME}/airflow:${APP_ENV}

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    networks:
      - ocp-network

    ports:
      - "${AIRFLOW_PORT}:8080"

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME: airflow

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DATABASE}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - airflow_logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags

    command: webserver


  airflow-scheduler:

    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: ${PROJECT_NAME}/airflow:${APP_ENV}

    restart: unless-stopped

    networks:
      - ocp-network

    depends_on:

      airflow-init:
        condition: service_completed_successfully

      spark-master:
        condition: service_healthy

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME: airflow

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DATABASE}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      SPARK_MASTER_URL: spark://spark-master:${SPARK_MASTER_PORT}

      HIVE_METASTORE_URI: thrift://hive-metastore:9083

      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}

      MINIO_HOST: minio

      MINIO_API_PORT: 9000

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:

      - ./airflow/dags:/opt/airflow/dags

      - ./jobs:/opt/airflow/jobs

      - airflow_logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command: scheduler



  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile

    image: ${PROJECT_NAME}/ingestion:${APP_ENV}

    restart: "no"

    depends_on:
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

    networks:
      - ocp-network

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME : ingestion

      # MySQL (source)
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # MinIO
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Bronze
      BRONZE_BUCKET: ${BRONZE_BUCKET}

      # Logs
      LOG_LEVEL: INFO

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    command: tail -f /dev/null



  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z

    restart: unless-stopped

    networks:
      - ocp-network

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    command: >
      server /data
      --console-address ":${MINIO_CONSOLE_PORT}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:15

    restart: unless-stopped

    networks:
      - ocp-network

    ports:
      - "${POSTGRES_PORT}:5432"

    env_file:
      - .env.dev

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  minio-bootstrap:
    image: minio/mc:latest

    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    networks:
      - ocp-network

    environment:
      MINIO_API_PORT: ${MINIO_API_PORT}

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      BRONZE_BUCKET: ${BRONZE_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      GOLD_BUCKET: ${GOLD_BUCKET}
      MODELS_BUCKET: ${MODELS_BUCKET}

    volumes:
      - ./docker/minio/init.sh:/init.sh:ro

    entrypoint:
      - /bin/sh
      - /init.sh

  hive-metastore:
    build:
      context: .
      dockerfile: docker/hive/Dockerfile

    image: ${PROJECT_NAME}/hive:${APP_ENV}

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

    networks:
      - ocp-network

    ports:
      - "${HIVE_METASTORE_PORT}:9083"

    environment:

      APP_ENV: ${APP_ENV}
      HIVE_SERVICE: metastore

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HIVE_DATABASE: ${POSTGRES_HIVE_DATABASE}

      HIVE_METASTORE_DB_TYPE: postgres

      # MinIO
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Hive
      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z localhost 9083 || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  hive-server:

    build:
      context: .
      dockerfile: docker/hive/Dockerfile

    image: ${PROJECT_NAME}/hive:${APP_ENV}

    restart: unless-stopped

    depends_on:

      hive-metastore:
        condition: service_healthy

    networks:
      - ocp-network

    ports:
      - "${HIVE_SERVER_PORT}:10000"

    environment:
      APP_ENV: ${APP_ENV}

      HIVE_SERVICE: server2

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HIVE_DATABASE: ${POSTGRES_HIVE_DATABASE}

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}

      MINIO_HOST: minio
      MINIO_API_PORT: 9000

      HIVE_METASTORE_DB_TYPE: postgres


  metabase:
    image: metabase/metabase:v0.56.3

    restart: unless-stopped

    depends_on:
      hive-server:
        condition: service_started

    networks:
      - ocp-network

    ports:
      - "${METABASE_PORT}:3000"

    environment:
      MB_DB_TYPE: h2

      MB_SITE_NAME: ${PROJECT_NAME}

      MB_ANON_TRACKING_ENABLED: "false"

      JAVA_TIMEZONE: UTC

    volumes:
      - metabase_data:/metabase-data

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"




  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: ${PROJECT_NAME}/spark:${APP_ENV}

    restart: unless-stopped

    depends_on:
      minio:
        condition: service_healthy

      hive-metastore:
        condition: service_healthy

    networks:
      - ocp-network

    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_WEBUI_PORT}:8080"

    env_file:
      - .env.dev

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME : spark

      SPARK_MODE: master

      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      HIVE_METASTORE_URI: thrift://hive-metastore:9083

      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}

    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080 > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  spark-worker-1:
    image: ${PROJECT_NAME}/spark:${APP_ENV}

    restart: unless-stopped

    depends_on:
      spark-master:
        condition: service_healthy

    networks:
      - ocp-network

    env_file:
      - .env.dev

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME : spark

      SPARK_MODE: worker

      SPARK_MASTER_URL: spark://spark-master:${SPARK_MASTER_PORT}
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_WORKER_WEBUI_PORT: 8081

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      HIVE_METASTORE_URI: thrift://hive-metastore:9083

      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}

  spark-worker-2:
    image: ${PROJECT_NAME}/spark:${APP_ENV}

    restart: unless-stopped

    depends_on:
      spark-master:
        condition: service_healthy

    networks:
      - ocp-network

    env_file:
      - .env.dev

    environment:

      APP_ENV: ${APP_ENV}

      SERVICE_NAME : spark

      SPARK_MODE: worker

      SPARK_MASTER_URL: spark://spark-master:${SPARK_MASTER_PORT}
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_WORKER_WEBUI_PORT: 8082
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      HIVE_METASTORE_URI: thrift://hive-metastore:9083

      HIVE_WAREHOUSE_DIR: ${HIVE_WAREHOUSE_DIR}